services:
  # 1. The Database
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: bhetiyo_db
      MYSQL_ROOT_PASSWORD: your_root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. The Backend
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=your_root_password
      - DB_NAME=bhetiyo_db
    depends_on:
      - db

  # 3. The Frontend
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
